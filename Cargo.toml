[package]
name = "beautiful_apis"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
figment = { version = "0.10.19", features = ["toml", "env"] }
futures = "0.3.34"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
openapiv3 = "2.2.0"
rand = "0.10.3"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tokio-stream = "0.1.19"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "timeout", "compression-full"] }
tower_governor = "0.8.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "6.0.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "10.0.1", features = ["axum"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
validator = { version = "0.21.0", features = ["derive"] }

[dev-dependencies]
insta = { version = "1.49.0", features = ["json"] }
reqwest = { version = "0.13.5", features = ["json"] }
